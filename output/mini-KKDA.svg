<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 128" width="432" height="128" role="img" aria-label="KKDA: Kawaii Karing Data Analyzer">
<defs><style>
@font-face{font-family:'GDisplay';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'GSans';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'GMono';src:url(data:font/woff2;base64,) format('woff2');}

.d{font-family:'GDisplay',Geist,Inter,system-ui,sans-serif;font-weight:500;}
.s{font-family:'GSans',Geist,Inter,system-ui,sans-serif;}
.m{font-family:'GMono','Geist Mono',ui-monospace,monospace;}
.rise{animation:rise 720ms cubic-bezier(.22,1,.36,1) both;}
@keyframes rise{0%{opacity:0;transform:translateY(14px);}}
.word{animation:word 900ms cubic-bezier(.22,1,.36,1) both;}
@keyframes word{0%{opacity:0;transform:translateY(.32em);filter:blur(10px);}}
.fadein{animation:fadein 1100ms cubic-bezier(.22,1,.36,1) both;}
@keyframes fadein{0%{opacity:0;}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1200ms cubic-bezier(.22,1,.36,1) both;}
@keyframes grow{0%{transform:scaleX(0);}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}


</style></defs>
<rect x=".5" y=".5" width="431" height="127" rx="14" fill="#181818" stroke="#2b2b2b"/>
<text x="20" y="37" class="d rise" font-size="16" letter-spacing="-.3" fill="#f2f2f2">KKDA</text>
<g class="rise"><path transform="translate(385.0 24.5)" d="M7 1.2l1.75 3.55 3.92.57-2.84 2.76.67 3.9L7 10.13 3.5 11.98l.67-3.9L1.33 5.32l3.92-.57z" fill="none" stroke="#8c8c8c" stroke-width="1.2" stroke-linejoin="round"/><text x="412" y="36" text-anchor="end" class="s" font-size="13" fill="#b4b4b4">2</text></g>
<text x="20" y="62" class="s rise" style="animation-delay:.06s" font-size="13.5" fill="#b4b4b4">Kawaii Karing Data Analyzer</text>
<text x="20" y="110" class="m rise" style="animation-delay:.1s" font-size="11" fill="#8c8c8c">HTML · Updated Jul 2026</text>
</svg>
